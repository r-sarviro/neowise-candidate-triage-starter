<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #status { margin-top: 1rem; }
    #draft { white-space: pre-wrap; margin: .5rem 0 0; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div id="result" aria-live="polite">
    <p id="status"></p>
    <pre id="draft" hidden></pre>
  </div>
  <script type="module">
    const form = document.querySelector("form");
    const statusEl = document.querySelector("#status");
    const draftEl = document.querySelector("#draft");

    const topicLabels = {
      delivery: "Доставка",
      pricing: "Цены",
      other: "Другое",
    };

    function clearDraft() {
      draftEl.hidden = true;
      draftEl.textContent = "";
    }

    function showReady(topic, draft) {
      const label = topicLabels[topic] ?? topic;
      statusEl.textContent = `Тема: ${label}`;
      draftEl.hidden = false;
      draftEl.textContent = draft;
    }

    function showManualReview() {
      statusEl.textContent = "Не удалось разобрать заявку автоматически. Разберите вручную.";
      clearDraft();
    }

    function showError(message) {
      statusEl.textContent = message;
      clearDraft();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "Разбираем заявку…";
      clearDraft();

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const data = await reply.json();

        if (data.status === "ready") {
          showReady(data.topic, data.draft);
          return;
        }
        if (data.status === "manual_review") {
          showManualReview();
          return;
        }
        if (data.status === "invalid_input") {
          showError("Введите непустой текст заявки.");
          return;
        }
        showError("Не удалось обработать заявку. Попробуйте ещё раз.");
      } catch {
        showError("Не удалось связаться с сервером. Попробуйте ещё раз.");
      }
    });
  </script>
</body>
</html>
